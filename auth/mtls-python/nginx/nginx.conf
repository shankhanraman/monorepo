events {}

http {
  server {
    listen 8443 ssl;
    server_name localhost;

    # This server's own TLS identity.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Ask for a client certificate and verify it against our CA, but don't require it at the TLS
    # layer: "optional" lets public reads through without a cert, and the app gates writes instead.
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client optional;

    location / {
      proxy_pass http://server:8000;
      proxy_set_header Host $host;
      # proxy_set_header REPLACES any client-supplied value, so these can't be spoofed by the caller.
      proxy_set_header X-SSL-Client-Verify $ssl_client_verify;   # SUCCESS | FAILED:<reason> | NONE
      proxy_set_header X-SSL-Client-DN     $ssl_client_s_dn;      # e.g. CN=alice
    }
  }
}
