services:
  # Postgres for the app (database "app").
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    networks: [lab]
    ports:
      - "5439:5432"  # 5434-5438: the other labs, 5437: media-insight-engine
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/create-databases.sql:/db/create-databases.sql:ro
      - ./postgres/initdb.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  # FastAPI. NOT published to the host: the only way in is nginx, on the lab network. That is what makes
  # the forwarded X-SSL-* headers trustworthy — a client can't reach FastAPI directly to forge them.
  server:
    build: ./fastapi-seerver
    environment:
      APP_NAME: fastapi-server
      CORS_ORIGIN: http://localhost:5178
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
    networks: [lab]
    depends_on:
      db: { condition: service_healthy }
    # runs migrations, then serves on the internal network only
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  # nginx terminates TLS, verifies the client cert against our CA, and proxies to FastAPI with the result.
  nginx:
    image: nginx:1.27-alpine
    networks: [lab]
    depends_on: [server]
    ports:
      - "8443:8443"  # the only entry point; curl / the browser talk mTLS here
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro      # ca.crt, server.crt, server.key (run certs/make-certs first)

networks:
  lab:

volumes:
  pg-data:
