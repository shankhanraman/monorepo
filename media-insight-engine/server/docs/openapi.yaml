                  collection_id: yale
                  type: youtube
                  url: https://www.youtube.com/watch?v=noCaps00000
                  label: Info session recording
                  priority: normal
                  title: Yale Virtual Information Session
                  host: Yale Admissions
                  published_at: "2024-11-02"
                  duration_s: 3605
                  status: failed
                  error: "Video unavailable (private, removed or region-blocked)"
                  archived: false
                  ingested_at: null
                  segment_count: 0
                  progress: null
                  stale: true
                  feed_url: null
                - id: 21
                  collection_id: yale
                  type: audio
                  url: https://traffic.megaphone.fm/YALE1234567890.mp3
                  label: "Episode 42: Testing policy"
                  priority: normal
                  title: "Episode 42: Testing policy"
                  host: Inside the Yale Admissions Office
                  published_at: "2026-09-01"
                  duration_s: 2160
                  status: transcribing
                  error: null
                  archived: false
                  ingested_at: null
                  segment_count: 0
                  progress: 42
                  stale: false
                  feed_url: https://feeds.megaphone.fm/insideyaleadmissions
                - id: 22
                  collection_id: yale
                  type: pdf
                  url: https://oir.yale.edu/common-data-set-2025-2026.pdf
                  label: Yale Common Data Set 2025-26
                  priority: normal
                  title: Common Data Set 2025-2026
                  host: oir.yale.edu
                  published_at: "2026-03-10"
                  duration_s: null
                  status: ready
                  error: null
                  archived: false
                  ingested_at: "2026-10-12T09:15:40Z"
                  segment_count: 41
                  progress: null
                  stale: false
                  feed_url: null
        "404": { $ref: "#/components/responses/NotFound" }

  /sources/{source_id}:
    get:
      tags: [sources]
      operationId: getSource
      summary: One source with overview, chapters, segments and key quotes (FR-3)
      parameters:
        - $ref: "#/components/parameters/SourceId"
      responses:
        "200":
          description: Full source. Chapters, segments and quotes are empty until `status` is `ready`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SourceDetail" }
              examples:
                youtube:
                  summary: Video (embedded YouTube player)
                  value:
                    id: 12
                    collection_id: yale
                    type: youtube
                    url: https://www.youtube.com/watch?v=abc123XYZ00
                    ext_id: abc123XYZ00
                    label: Admissions podcast – supplemental essays
                    priority: high
                    title: "Inside the Yale Admissions Office: Supplemental Essays"
                    host: Yale Admissions
                    published_at: "2025-09-15"
                    duration_s: 2112
                    status: ready
                    error: null
                    archived: false
                    ingested_at: "2026-10-11T14:07:02Z"
                    segment_count: 36
                    progress: null
                    stale: false
                    feed_url: null
                    media_url: null
                    overview: "Two Yale admissions officers explain how the supplemental essays are read. Aimed at applicants and counselors; covers the short answers, the 'why Yale' and 'why this major' prompts, and common mistakes. Useful for planning every Yale-specific essay."
                    chapters:
                      - { id: 101, start_s: 0, end_s: 570, title: Introduction and how files are read, summary: "The hosts introduce themselves and describe the committee process. Essays are read for voice, not polish." }
                      - { id: 102, start_s: 570, end_s: 1065, title: Supplemental essays, summary: "Each short answer should add something new. Officers want specifics about academic interests and community." }
                    segments:
                      - id: 5001
                        ord: 12
                        start_s: 720
                        end_s: 780
                        anchor: null
                        text: "so when you write about why you want to study a major, we really want to hear what got you curious in the first place..."
                        summary: Officers want the origin of the interest in the major, told through a specific experience.
                        tags: [essays, why-major]
                        deep_link: https://youtu.be/abc123XYZ00?t=720
                    key_quotes:
                      - id: 301
                        segment_id: 5001
                        ts_s: 731
                        quote: "we really want to hear what got you curious in the first place"
                        is_advice: true
                        deep_link: https://youtu.be/abc123XYZ00?t=731
                audio:
                  $ref: "#/components/examples/SourceAudio"
        "404": { $ref: "#/components/responses/NotFound" }

  /collections/{collection_id}/ask:
    post:
      tags: [ask]
      operationId: ask
      summary: Ask a grounded question (FR-4)
      description: |
        Answers only from retrieved segments. Every `[n]` in `answer_md` matches a citation with the same `n`.
        If the sources don't cover the question, `not_covered` is true, `answer_md` is "Not covered in your sources."
        and `closest` lists the nearest segments.
        Use `all` as the collection id to search every college (FR-1.6).
        Typical latency 3–10 s.
      parameters:
        - name: collection_id
          in: path
          required: true
          description: Collection slug, or `all`
          schema: { type: string, pattern: "^[a-z0-9-]+$" }
          example: yale
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AskRequest" }
            examples:
              simple:
                summary: First question
                value:
                  question: What does Yale look for in the why-this-major short answer?
              followUp:
                summary: Follow-up with history and filters
                value:
                  question: And how long should it be?
                  history:
                    - question: What does Yale look for in the why-this-major short answer?
                      answer_md: "Officers want the origin of your interest, told through a specific experience [1] ..."
                  filters:
                    source_ids: [12]
                    tags: [essays]
                    date_from: "2024-01-01"
                    date_to: null
      responses:
        "200":
          description: Answer with citations, or a not-covered result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AskResponse" }
              examples:
                covered: { $ref: "#/components/examples/AskCovered" }
                notCovered: { $ref: "#/components/examples/AskNotCovered" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502":
          description: The language model call failed after retries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "Answer generation failed, please retry" }

  /collections/{collection_id}/question-banks:
    get:
      tags: [question-banks]
      operationId: listQuestionBanks
      summary: Saved question banks of a collection
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Banks, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuestionBank" }
              examples: { BankList: { $ref: "#/components/examples/BankList" } }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [question-banks]
      operationId: createQuestionBank
      summary: Save a named list of questions (FR-5.1)
      description: The client parses pasted text (one per line) or CSV (first column) and sends a clean list.
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QuestionBankCreate" }
            example:
              name: Yale supplements + testing
              questions:
                - What does Yale look for in the why-this-major short answer?
                - Is the SAT/ACT required and how much does it matter?
      responses:
        "201":
          description: Saved bank
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuestionBank" }
              examples: { BankYale: { $ref: "#/components/examples/BankYale" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /question-banks/{bank_id}:
    delete:
      tags: [question-banks]
      operationId: deleteQuestionBank
      summary: Delete a bank and its runs
      parameters:
        - $ref: "#/components/parameters/BankId"
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

  /question-banks/{bank_id}/run:
    post:
      tags: [question-banks]
      operationId: runQuestionBank
      summary: Run every question in the bank through ask (FR-5.2)
      description: Starts a background run and returns at once. Poll `GET /bank-runs/{run_id}` every 2 s until `status` is `done` or `failed`.
      parameters:
        - $ref: "#/components/parameters/BankId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                filters: { $ref: "#/components/schemas/AskFilters" }
            example: { filters: { tags: [] } }
      responses:
        "202":
          description: Run started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankRun" }
              example:
                id: 7
                bank_id: 3
                bank_name: Yale supplements + testing
                collection_id: yale
                status: running
                done: 0
                total: 2
                created_at: "2026-10-11T15:00:00Z"
                finished_at: null
                items:
                  - { index: 0, question: "What does Yale look for in the why-this-major short answer?", status: pending, answer_md: null, coverage: null, watch: [], stale_warning: null, error: null }
                  - { index: 1, question: "Is the SAT/ACT required and how much does it matter?", status: pending, answer_md: null, coverage: null, watch: [], stale_warning: null, error: null }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A run of this bank is already in progress
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "Bank 3 is already running (run 7)" }

  /bank-runs/{run_id}:
    get:
      tags: [question-banks]
      operationId: getBankRun
      summary: Progress and report of a bank run (FR-5.2, FR-5.3)
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run with one report item per question (in bank order)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankRun" }
              examples: { BankRunDone: { $ref: "#/components/examples/BankRunDone" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /bank-runs/{run_id}/report.md:
    get:
      tags: [question-banks]
      operationId: exportBankRunMarkdown
      summary: Report as a Markdown file (FR-5.4)
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Markdown download (`Content-Disposition attachment; filename="yale-report-7.md"`)
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="yale-report-7.md"
          content:
            text/markdown:
              schema: { type: string }
              example: |
                # Yale supplements + testing
                _Yale · run 7 · 2026-10-11 · summary of sources, verify on the official admissions site_

                ## 1. What does Yale look for in the why-this-major short answer?
                **Coverage:** strong

                Officers want the origin of your interest, told through a specific experience [1] ...

                **Watch these**
                1. [Inside the Yale Admissions Office: Supplemental Essays — 12:00](https://youtu.be/abc123XYZ00?t=720) (2025-09-15)
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Run not finished yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "Run 7 is still running" }

  /bank-runs/{run_id}/report.pdf:
    get:
      tags: [question-banks]
      operationId: exportBankRunPdf
      summary: Report as a PDF file (FR-5.4, Day 2)
      description: Same content as the Markdown export, with clickable links. Takes a few seconds to generate.
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: PDF download (`Content-Disposition attachment; filename="yale-report-7.pdf"`)
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="yale-report-7.pdf"
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Run not finished yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "Run 7 is still running" }

  /notes:
    get:
      tags: [notes]
      operationId: listNotes
      summary: Saved answers, newest first
      parameters:
        - name: collection
          in: query
          required: false
          description: Only notes of this collection (`all` = notes saved from all-colleges questions)
          schema: { type: string }
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Note" }
              examples: { NoteList: { $ref: "#/components/examples/NoteList" } }
    post:
      tags: [notes]
      operationId: createNote
      summary: Save an answer to Notes (FR-4.6)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteCreate" }
            example:
              collection_id: yale
              question: What does Yale look for in the why-this-major short answer?
              answer_md: "Officers want the origin of your interest, told through a specific experience [1] ..."
              coverage: strong
              citations: []
              comment: Use for Aksh's draft
      responses:
        "201":
          description: Saved note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Note" }
              examples: { NoteExample: { $ref: "#/components/examples/NoteExample" } }
        "422": { $ref: "#/components/responses/ValidationError" }

  /notes/{note_id}:
    delete:
      tags: [notes]
      operationId: deleteNote
      summary: Delete a note
      parameters:
        - name: note_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    CollectionId:
      name: collection_id
      in: path
      required: true
      description: Collection slug (config file name without .yaml)
      schema: { type: string, pattern: "^[a-z0-9-]+$" }
      example: yale
    SourceId:
      name: source_id
      in: path
      required: true
      schema: { type: integer }
      example: 12
    BankId:
      name: bank_id
      in: path
      required: true
      schema: { type: integer }
      example: 3
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: integer }
      example: 7

  responses:
    NotFound:
      description: Unknown id
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { detail: "Not found" }
    ValidationError:
      description: Request body failed validation (FastAPI format)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
          example:
            detail:
              - { loc: [body, question], msg: "String should have at least 3 characters", type: string_too_short }

  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }

    ValidationErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, msg, type]
            properties:
              loc: { type: array, items: { type: [string, integer] } }
              msg: { type: string }
              type: { type: string }

    SourceType:
      type: string
      enum: [youtube, web, audio, pdf]
      description: |
        youtube – video; captions, or speech-to-text when it has none. Time-based segments.
        web     – web page; one segment per section.
        audio   – podcast episode (MP3, RSS feed episode, or a podcast page yt-dlp supports); speech-to-text, time-based segments.
        pdf     – PDF document; one segment per page (long pages split).

    SourceStatus:
      type: string
      enum: [queued, transcribing, analyzing, ready, failed]

    Coverage:
      type: string
      enum: [strong, partial, none]

    Priority:
      type: string
      enum: [high, normal, low]

    Collection:
      type: object
      required: [id, name, lens_name, lens_tags, focus_note, segment_seconds, source_counts, last_synced_at]
      properties:
        id: { type: string, description: "Slug, e.g. yale" }
        name: { type: string }
        lens_name: { type: string, description: "Shared lens file name, or `inline` when the college defines its own" }
        lens_tags:
          type: array
          items: { type: string }
          description: Allowed tag vocabulary (use for the tag filter)
        focus_note: { type: [string, "null"] }
        segment_seconds: { type: integer, minimum: 30, maximum: 300 }
        source_counts:
          type: object
          required: [total, ready, in_progress, failed, archived]
          properties:
            total: { type: integer, description: Not archived }
            ready: { type: integer }
            in_progress: { type: integer, description: queued + transcribing + analyzing }
            failed: { type: integer }
            archived: { type: integer }
        last_synced_at: { type: [string, "null"], format: date-time }

    SyncAction:
      type: string
      enum: [queued, skipped, failed, archived, feed]
      description: |
        feed     – an RSS feed entry was read; reason says how many episodes were selected. Its episodes follow
                   as their own lines (with feed_url set). Feed lines are not counted in the summary.
        queued   – new URL or failed before; ingest started.
        skipped  – already ready or already being ingested (reason says which).
        failed   – invalid entry or unsupported type; nothing ingested (reason says why).
        archived – removed from the YAML; hidden from answers, kept in the database.

    SyncEntry:
      type: object
      required: [url, label, action, reason, source_id, feed_url]
      properties:
        url: { type: string, description: Normalized URL }
        label: { type: [string, "null"] }
        action: { $ref: "#/components/schemas/SyncAction" }
        reason: { type: string }
        source_id: { type: [integer, "null"], description: "Null when the entry failed validation, and for feed lines" }
        feed_url: { type: [string, "null"], description: The RSS feed an episode came from; null otherwise }

    SyncLog:
      type: object
      required: [id, collection_id, created_at, summary, entries]
      properties:
        id: { type: integer }
        collection_id: { type: string }
        created_at: { type: string, format: date-time }
        summary:
          type: object
          required: [queued, skipped, failed, archived]
          properties:
            queued: { type: integer }
            skipped: { type: integer }
            failed: { type: integer }
            archived: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/SyncEntry" }

    SourceSummary:
      type: object
      required: [id, collection_id, type, url, label, priority, title, host, published_at, duration_s, status, error, archived, ingested_at, segment_count, progress, stale, feed_url]
      properties:
        id: { type: integer }
        collection_id: { type: string }
        type: { $ref: "#/components/schemas/SourceType" }
        url: { type: string }
        label: { type: [string, "null"], description: From the YAML }
        priority: { $ref: "#/components/schemas/Priority" }
        title: { type: [string, "null"], description: From the source metadata; null until fetched }
        host: { type: [string, "null"], description: "YouTube channel, podcast show, or website name" }
        published_at: { type: [string, "null"], format: date, description: "Null = date unknown (treat as possibly stale)" }
        duration_s: { type: [integer, "null"], description: Video and audio only }
        status: { $ref: "#/components/schemas/SourceStatus" }
        error: { type: [string, "null"], description: Reason when status is failed }
        archived: { type: boolean }
        ingested_at: { type: [string, "null"], format: date-time, description: When it became ready }
        segment_count: { type: integer }
        progress:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: Transcription progress while an audio source (or a YouTube video without captions) is `transcribing`; null otherwise
        stale: { type: boolean, description: "Published longer ago than the collection's stale_after_months (default 18), or date unknown" }
        feed_url: { type: [string, "null"], description: The RSS feed this episode came from }

    Chapter:
      type: object
      required: [id, start_s, end_s, title, summary]
      properties:
        id: { type: integer }
        start_s: { type: integer }
        end_s: { type: integer }
        title: { type: string }
        summary: { type: string, description: 2–3 sentences }

    Segment:
      type: object
      required: [id, ord, start_s, end_s, anchor, text, summary, tags, deep_link]
      description: |
        youtube / audio: a time slice (default 60 s).
        web: a page section; `start_s`/`end_s` are the section order number and `anchor` is the heading.
        pdf: a page (or part of a long page); `start_s`/`end_s` are the order number and `anchor` is "Page N".
      properties:
        id: { type: integer }
        ord: { type: integer, description: "Position in the source, from 0" }
        start_s: { type: integer }
        end_s: { type: integer }
        anchor: { type: [string, "null"], description: "Section heading (web) or Page N (pdf); null for video and audio" }
        text: { type: string, description: Raw transcript / page text (show it so users can check caption errors) }
        summary: { type: string, description: 1–2 sentence minute summary }
        tags:
          type: array
          items: { type: string }
        deep_link: { type: string, description: "External link: YouTube ?t=, audio file #t=, web page #:~:text=, or PDF #page=" }

    KeyQuote:
      type: object
      required: [id, segment_id, ts_s, quote, is_advice, deep_link]
      properties:
        id: { type: integer }
        segment_id: { type: integer }
        ts_s: { type: integer }
        quote: { type: string, description: Verbatim words from the transcript (label as "verbatim") }
        is_advice: { type: boolean, description: Direct advice from the speaker }
        deep_link: { type: string }

    SourceDetail:
      allOf:
        - $ref: "#/components/schemas/SourceSummary"
        - type: object
          required: [ext_id, media_url, overview, chapters, segments, key_quotes]
          properties:
            ext_id: { type: [string, "null"], description: YouTube video id (for the embedded player); null otherwise }
            media_url: { type: [string, "null"], description: "Playable audio URL for the in-app audio player (audio sources); null otherwise" }
            overview: { type: [string, "null"], description: One paragraph; null until ready }
            chapters:
              type: array
              items: { $ref: "#/components/schemas/Chapter" }
            segments:
              type: array
              items: { $ref: "#/components/schemas/Segment" }
            key_quotes:
              type: array
              items: { $ref: "#/components/schemas/KeyQuote" }

    InsightKind:
      type: string
      enum: [theme, contradiction, trend, gap]
      description: |
        theme         – a topic or advice several sources agree on.
        contradiction – sources give conflicting guidance.
        trend         – an emphasis that shifts with the publish date.
        gap           – a Lens tag the sources barely cover (0–1 sources).

    InsightCitation:
      type: object
      required: [source_id, source_title, source_type, published_at, app_link]
      properties:
        source_id: { type: integer }
        source_title: { type: string }
        source_type: { $ref: "#/components/schemas/SourceType" }
        published_at: { type: [string, "null"], format: date }
        app_link: { type: string, description: "In-app route to the source page: /sources/<id>" }

    InsightEvidence:
      type: object
      required: [source_id, source_title, source_type, quote, role, app_link, timestamp_s]
      properties:
        source_id: { type: integer }
        source_title: { type: string }
        source_type: { $ref: "#/components/schemas/SourceType" }
        quote: { type: string, description: "Verified verbatim excerpt from a key quote" }
        role: { type: string, enum: [supports, opposes, context] }
        app_link: { type: string, description: "In-app deep link to the supporting source evidence" }
        timestamp_s: { type: integer }

    Insight:
      type: object
      required: [kind, title, detail, tag, sources, evidence, confidence, recommended_action]
      properties:
        kind: { $ref: "#/components/schemas/InsightKind" }
        title: { type: string, description: Short, specific headline }
        detail: { type: string, description: "1–3 sentences, grounded in the cited sources" }
        tag: { type: [string, "null"], description: "Most relevant Lens tag (always set for a gap)" }
        sources:
          type: array
          items: { $ref: "#/components/schemas/InsightCitation" }
          description: Supporting sources (may be empty only for a gap)
        evidence:
          type: array
          items: { $ref: "#/components/schemas/InsightEvidence" }
          description: Verified excerpts that support or oppose the finding
        confidence: { type: string, enum: [high, medium, low] }
        recommended_action: { type: [string, "null"], description: Concrete next step for the reader }

    CoverageTopic:
      type: object
      required: [tag, sources, gap]
      properties:
        tag: { type: string }
        sources: { type: integer, description: Distinct ready sources carrying this tag }
        gap: { type: boolean, description: True when 0–1 sources cover the tag }

    TimelineBucket:
      type: object
      required: [period, sources]
      properties:
        period: { type: string, description: 'Publish year ("2025") or "Undated"' }
        sources: { type: integer }

    CollectionAnalysis:
      type: object
      required: [collection_id, status, model, source_count, segment_count, consensus, insights, coverage, timeline, stale, error, generated_at]
      properties:
        collection_id: { type: string }
        status:
          type: string
          enum: [ready, running, failed, empty]
          description: "empty = never run; running = refresh in flight (old insights still shown); failed = last run errored"
        model: { type: [string, "null"] }
        source_count: { type: integer, description: Ready sources the analysis covered }
        segment_count: { type: integer }
        consensus: { type: [integer, "null"], minimum: 0, maximum: 100, description: "Legacy theme-to-conflict ratio; do not interpret as evidence confidence" }
        insights:
          type: array
          items: { $ref: "#/components/schemas/Insight" }
        coverage:
          type: array
          items: { $ref: "#/components/schemas/CoverageTopic" }
          description: One per Lens tag, most-covered first
        timeline:
          type: array
          items: { $ref: "#/components/schemas/TimelineBucket" }
          description: Ready sources by publish year
        stale: { type: boolean, description: Sources changed (or a sync ran) after this was generated }
        error: { type: [string, "null"] }
        generated_at: { type: [string, "null"], format: date-time }

    AskFilters:
      type: object
      properties:
        source_ids:
          type: array
          items: { type: integer }
          description: Empty or missing = all sources
        tags:
          type: array
          items: { type: string }
          description: Segment must have at least one of these tags
        date_from: { type: [string, "null"], format: date, description: Source published on or after }
        date_to: { type: [string, "null"], format: date, description: Source published on or before }

    HistoryTurn:
      type: object
      required: [question, answer_md]
      properties:
        question: { type: string }
        answer_md: { type: string }

    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 3, maxLength: 2000 }
        history:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/HistoryTurn" }
          description: Earlier turns of this chat, oldest first (the server is stateless)
        filters: { $ref: "#/components/schemas/AskFilters" }

    Citation:
      type: object
      required: [n, segment_id, source_id, collection_id, source_type, source_title, host, published_at, start_s, end_s, anchor, label, snippet, deep_link, app_link, stale]
      properties:
        n: { type: integer, description: "Matches [n] in answer_md (starts at 1)" }
        segment_id: { type: integer }
        source_id: { type: integer }
        collection_id: { type: string, description: Useful when asking across all colleges }
        source_type: { $ref: "#/components/schemas/SourceType" }
        source_title: { type: string }
        host: { type: [string, "null"] }
        published_at: { type: [string, "null"], format: date }
        start_s: { type: integer }
        end_s: { type: integer }
        anchor: { type: [string, "null"], description: "Section heading (web) or Page N (pdf)" }
        label: { type: string, description: 'Ready-to-show position: "12:00–13:00" for video/audio, the heading for web, "Page 3" for pdf' }
        snippet: { type: string, description: Supporting transcript or page text }
        deep_link: { type: string, description: "Open externally: https://youtu.be/<id>?t=<s> · <audio file>#t=<s> · <url>#:~:text=<first words> · <pdf>#page=<n>" }
        app_link: { type: string, description: "In-app route: /sources/<id>?t=<s> for youtube/audio (plays there); /sources/<id>#seg-<segment_id> for web/pdf" }
        stale: { type: boolean, description: Source older than 18 months or date unknown }

    AskResponse:
      type: object
      required: [question, label, answer_md, coverage, not_covered, citations, closest, stale_warning, conflicts, retried]
      properties:
        question: { type: string }
        label: { type: string, const: Summary of sources, description: "Show above the answer (synthesis, not verbatim)" }
        answer_md: { type: string, description: "Plain text with paragraphs and [n] markers; no other Markdown" }
        coverage: { $ref: "#/components/schemas/Coverage" }
        not_covered: { type: boolean }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
          description: Ordered by n. Empty when not_covered.
        closest:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
          description: Up to 3 nearest segments when not_covered (n = 1..3, not referenced in the text)
        stale_warning: { type: [string, "null"], description: Show as a warning banner }
        conflicts: { type: [string, "null"], description: Where sources disagree; show as a banner }
        retried: { type: boolean, description: True when the search was rewritten once (debug/info) }

    QuestionBankCreate:
      type: object
      required: [name, questions]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        questions:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, minLength: 3, maxLength: 2000 }

    QuestionBank:
      type: object
      required: [id, collection_id, name, questions, created_at, latest_run_id]
      properties:
        id: { type: integer }
        collection_id: { type: string }
        name: { type: string }
        questions:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        latest_run_id: { type: [integer, "null"] }

    ReportItem:
      type: object
      required: [index, question, status, answer_md, coverage, watch, stale_warning, error]
      properties:
        index: { type: integer, description: "Position in the bank, from 0" }
        question: { type: string }
        status: { type: string, enum: [pending, done, failed] }
        answer_md: { type: [string, "null"], description: "Short answer with [n] markers matching watch[].n" }
        coverage:
          oneOf:
            - $ref: "#/components/schemas/Coverage"
            - type: "null"
        watch:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/Citation" }
          description: '"Watch these": 2–5 cited moments ranked by relevance (fewer only if fewer were cited)'
        stale_warning: { type: [string, "null"] }
        error: { type: [string, "null"] }

    BankRun:
      type: object
      required: [id, bank_id, bank_name, collection_id, status, done, total, created_at, finished_at, items]
      properties:
        id: { type: integer }
        bank_id: { type: integer }
        bank_name: { type: string }
        collection_id: { type: string }
        status: { type: string, enum: [running, done, failed] }
        done: { type: integer, description: Finished questions (done or failed) }
        total: { type: integer }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/ReportItem" }

    NoteCreate:
      type: object
      required: [collection_id, question, answer_md, coverage, citations]
      properties:
        collection_id: { type: string, description: Slug or `all` }
        question: { type: string }
        answer_md: { type: string }
        coverage: { $ref: "#/components/schemas/Coverage" }
        citations:
          type: array
          items: { $ref: "#/components/schemas/Citation" }
        comment: { type: [string, "null"], maxLength: 2000 }

    Note:
      allOf:
        - $ref: "#/components/schemas/NoteCreate"
        - type: object
          required: [id, created_at]
          properties:
            id: { type: integer }
            created_at: { type: string, format: date-time }

  examples:
    InsightsYale:
      summary: Collection insights with Atlas data
      value:
        collection_id: yale
        status: ready
        model: claude-opus-5-5
        source_count: 18
        segment_count: 240
