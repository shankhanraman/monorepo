          - kind: contradiction
            title: "Test-optional: skip the SAT, or submit anyway?"
            detail: "The 2024 info session says a strong score only helps; the 2025 FAQ says scores are truly optional and never counted against an applicant."
            tag: testing
            sources:
              - { source_id: 14, source_title: Yale Virtual Information Session, source_type: youtube, published_at: "2024-11-02", app_link: /sources/14 }
              - { source_id: 22, source_title: Common Data Set 2025-2026, source_type: pdf, published_at: "2026-03-10", app_link: /sources/22 }
          - kind: gap
            title: Financial aid is barely covered
            detail: "Financial aid is a Lens tag, yet only one source touches it, and only in passing."
            tag: financial-aid
            sources:
              - { source_id: 13, source_title: "Essays | Yale College Undergraduate Admissions", source_type: web, published_at: null, app_link: /sources/13 }
        coverage:
          - { tag: essays, sources: 11, gap: false }
          - { tag: testing, sources: 6, gap: false }
          - { tag: interviews, sources: 4, gap: false }
          - { tag: financial-aid, sources: 1, gap: true }
        timeline:
