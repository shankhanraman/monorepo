openapi: 3.1.0
info:
  title: Media Insight Engine API
  version: 0.2.0
  description: |
    Day-1 + Day-2 API for the Admissions Media Insight Engine (PRD FR-1 … FR-5).
    Day 2 adds podcast audio (RSS feeds, MP3, speech-to-text), PDF sources, transcription progress,
    a source-level stale flag and the PDF report export.
    Readable guide with curl examples and polling rules: api-contract.md (same folder).

    Conventions
    - Collection ids are slugs from the config file name (`yale`, `mit`). `all` is accepted only by the ask endpoint.
    - All other ids are integers.
    - Times are in seconds (`start_s`, `end_s`, `ts_s`) for `youtube` and `audio` sources. For `web` and `pdf` sources
      they hold the section order number, not seconds; show `label` / `anchor` instead.
    - Dates are ISO 8601. `published_at` is a date (`YYYY-MM-DD`), other timestamps are date-times in UTC.
    - Errors: `{"detail": "message"}`; request validation errors (422) use FastAPI's `{"detail": [ … ]}` list.
# Day 1 has no authentication (PRD: single user, local). Basic auth arrives with hosting.
security: []
servers:
  - url: http://localhost:8003
    description: Local (docker compose)
tags:
  - name: health
    description: Liveness
  - name: collections
    description: Colleges from config/collections/*.yaml and their sync (FR-1)
  - name: sources
    description: Ingested videos and web pages with analysis (FR-2, FR-3)
  - name: insights
    description: Collection-wide synthesis across all sources (home page)
  - name: ask
    description: Grounded Q&A with citations (FR-4)
  - name: question-banks
    description: Saved question lists, runs and reports (FR-5)
  - name: notes
    description: Saved answers (FR-4.6)

paths:
  /health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness check
      responses:
        "200":
          description: Server and database are up
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
              example: { status: ok }

  /collections:
    get:
      tags: [collections]
      operationId: listCollections
      summary: List collections (one per config file)
      description: Includes collections that were never synced (counts are then 0 and `last_synced_at` is null).
      responses:
        "200":
          description: All collections, sorted by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Collection" }
              example:
                - id: mit
                  name: MIT
                  lens_name: undergrad-admissions
                  lens_tags: [testing, essays, why-major, ea-ed, extracurriculars, recommendations, interviews, financial-aid]
                  focus_note: Early Action, class of 2031
                  segment_seconds: 60
                  source_counts: { total: 4, ready: 4, in_progress: 0, failed: 0, archived: 0 }
                  last_synced_at: "2026-10-11T14:02:11Z"
                - id: yale
                  name: Yale
                  lens_name: undergrad-admissions
                  lens_tags: [testing, essays, why-major, ea-ed, extracurriculars, recommendations, interviews, financial-aid]
                  focus_note: Early Action, class of 2031
                  segment_seconds: 60
                  source_counts: { total: 5, ready: 3, in_progress: 1, failed: 1, archived: 0 }
                  last_synced_at: "2026-10-11T14:05:40Z"

  /sync:
    post:
      tags: [collections]
      operationId: syncCollection
      summary: Sync one collection with its YAML file (FR-1.3, FR-1.4)
      description: |
        Validates `config/collections/<collection>.yaml`, compares it with the database and returns the sync log.
        New and previously failed URLs are queued for background ingest (poll the sources list);
        unchanged ready URLs are skipped; URLs removed from the file are archived (never deleted).
        Idempotent: running it twice in a row gives `skipped` for everything already queued or ready.
      parameters:
        - name: collection
          in: query
          required: true
          schema: { type: string, pattern: "^[a-z0-9-]+$" }
          example: yale
      responses:
        "200":
          description: Sync log (ingest continues in the background)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncLog" }
              examples: { SyncLogYale: { $ref: "#/components/examples/SyncLogYale" } }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A sync for this collection is already running
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "Sync already running for 'yale'" }
        "422":
          description: The YAML file itself is invalid (e.g. missing `name`, unknown lens). Per-source problems are NOT errors; they appear as `failed` entries in the log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "config/collections/yale.yaml: lens 'undergrad' not found in config/lenses/" }

  /collections/{collection_id}/sync-log:
    get:
      tags: [collections]
      operationId: getLatestSyncLog
      summary: Latest sync log of a collection
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Most recent sync log
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncLog" }
              examples: { SyncLogYale: { $ref: "#/components/examples/SyncLogYale" } }
        "404":
          description: Unknown collection, or never synced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { detail: "Collection 'yale' has not been synced yet" }

  /collections/{collection_id}/insights:
    get:
      tags: [insights]
      operationId: getCollectionInsights
      summary: Collection-wide synthesis for the home page
      description: |
        Insights the analytical agent produced by reading every ready source together: themes and
        consensus advice, contradictions, trends over time, and coverage gaps, plus the Atlas
        (per-tag coverage, a source timeline and a consensus score).
        Regenerated automatically after each sync (once ingest finishes). `status` is `empty` until
        the first run completes, `running` while a refresh is in flight (previous insights stay
        visible), and `failed` if the last run errored. `stale` is true when sources changed since.
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Latest analysis (poll every 3 s while `status` is `running`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionAnalysis" }
              examples: { Insights: { $ref: "#/components/examples/InsightsYale" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /collections/{collection_id}/insights/refresh:
    post:
      tags: [insights]
      operationId: refreshCollectionInsights
      summary: Re-run the analytical agent on demand
      description: |
        Triggers a background re-synthesis (for a failed or stale result) and returns the current
        analysis at once. Poll `GET /collections/{collection_id}/insights` until `status` leaves `running`.
      parameters:
        - $ref: "#/components/parameters/CollectionId"
      responses:
        "200":
          description: Current analysis; a refresh is now queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CollectionAnalysis" }
              examples: { Insights: { $ref: "#/components/examples/InsightsYale" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /collections/{collection_id}/sources:
    get:
      tags: [sources]
      operationId: listSources
      summary: Sources of a collection with live status (FR-2.4)
      description: |
        Poll every 3 s while any source is `queued`, `transcribing` or `analyzing`.
        Audio sources report `progress` (0–100) while transcribing; on CPU this takes about 2x the episode length.
      parameters:
        - $ref: "#/components/parameters/CollectionId"
        - name: include_archived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Sources sorted by priority (high first), then label
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SourceSummary" }
              example:
                - id: 12
                  collection_id: yale
                  type: youtube
                  url: https://www.youtube.com/watch?v=abc123XYZ00
                  label: Admissions podcast – supplemental essays
                  priority: high
                  title: "Inside the Yale Admissions Office: Supplemental Essays"
                  host: Yale Admissions
                  published_at: "2025-09-15"
                  duration_s: 2112
                  status: ready
                  error: null
                  archived: false
                  ingested_at: "2026-10-11T14:07:02Z"
                  segment_count: 36
                  progress: null
                  stale: false
                  feed_url: null
                - id: 13
                  collection_id: yale
                  type: web
                  url: https://admissions.yale.edu/essays
                  label: Essay prompts page
                  priority: normal
                  title: Essays | Yale College Undergraduate Admissions
                  host: admissions.yale.edu
                  published_at: null
                  duration_s: null
