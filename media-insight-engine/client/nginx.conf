server {
    listen 80;
    root /usr/share/nginx/html;

    # API: /api/collections -> http://server:8003/collections
    # ponytail: upstream is the service name "server" (compose / k8s); template it if a deploy names it differently
    location /api/ {
        proxy_pass http://server:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # stream answers as they arrive
        proxy_read_timeout 300s;      # long Q&A / bank runs
    }

    # react-router: unknown paths load the app, which routes client-side
    location / {
        try_files $uri /index.html;
    }
}
