apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mie.fullname" . }}-secrets
  labels:
    {{- include "mie.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ required "secrets.anthropicApiKey is required (--set secrets.anthropicApiKey=sk-ant-... or -f values-local.yaml)" .Values.secrets.anthropicApiKey | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required (--set secrets.postgresPassword=... or -f values-local.yaml)" .Values.secrets.postgresPassword | quote }}
  # Fixed Vault token ids. Not strictly secret, but kept here so every workload reads them from one place.
  VAULT_SERVER_TOKEN: {{ .Values.secrets.vaultServerToken | quote }}
  VAULT_DB_TOKEN: {{ .Values.secrets.vaultDbToken | quote }}
