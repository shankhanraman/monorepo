apiVersion: v1
kind: Service
metadata:
  # Release-prefixed: nothing hard-codes this name. It is the entry point you port-forward.
  name: {{ include "mie.fullname" . }}-client
  labels:
    {{- include "mie.labels" . | nindent 4 }}
    app.kubernetes.io/component: client
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: client
  ports:
    - name: http
      port: 80
      targetPort: 80
