apiVersion: v1
kind: Service
metadata:
  # Literal name "server": client/nginx.conf hard-codes proxy_pass http://server:8003/.
  name: server
  labels:
    {{- include "mie.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8003
      targetPort: 8003
