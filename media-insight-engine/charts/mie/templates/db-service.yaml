apiVersion: v1
kind: Service
metadata:
  # Literal name "db": it must match the server cert SAN (DNS:db) so the app's
  # sslmode=verify-full connection validates the hostname.
  name: db
  labels:
    {{- include "mie.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  clusterIP: None   # headless, for the StatefulSet
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
