apiVersion: v1
kind: Service
metadata:
  # Literal name: VAULT_ADDR=http://vault:8200 in the app + cert-init + init-containers.
  name: vault
  labels:
    {{- include "mie.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
