# Postgres host-based auth for the Media Insight Engine.
# The app connects over TLS with a client certificate (CN=mie) -> cert auth, no password.
# A non-TLS password rule is kept so the non-Docker / dev-mac workflow still works
# (that path must connect with sslmode=disable to match the `host` rule, not `hostssl`).
#
# TYPE     DATABASE  USER  ADDRESS  METHOD
local      all       all            trust
hostssl    mie       mie   all      cert clientcert=verify-full
host       mie       mie   all      scram-sha-256
host       all       all   all      scram-sha-256
