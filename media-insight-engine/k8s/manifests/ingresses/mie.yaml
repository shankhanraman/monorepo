# minikube `ingress` addon (ingress-nginx). Each overlay sets the host (mie-<env>.local).
# Everything goes to the client; its nginx serves the app and proxies /api/* to the server.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mie
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"   # long Q&A / question-bank runs
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  rules:
    - host: mie.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: client, port: { name: http } }
