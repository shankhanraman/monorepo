# No Secret objects live here: every secret comes from Vault (see docs/architecture.md).
# These service accounts are the pods' identities. The Vault agent logs in to Vault's Kubernetes auth with
# them, and the Vault roles (scripts/vault-bootstrap.sh) bind each one to its least-privilege policy.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mie-server
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mie-postgres
automountServiceAccountToken: true
