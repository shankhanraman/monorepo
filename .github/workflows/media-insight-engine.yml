# media-insight-engine: tests on every PR / push; on main, publish the server + client images to GHCR.
name: media-insight-engine

on:
  pull_request:
    paths: [media-insight-engine/**, .github/workflows/media-insight-engine.yml]
  push:
    branches: [main]
    paths: [media-insight-engine/**, .github/workflows/media-insight-engine.yml]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media-insight-engine/server
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: mie
          POSTGRES_USER: mie
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mie -d mie"
          --health-interval 3s
          --health-retries 20
    env:
      # DB_AUTH stays "password": no Vault / client certs in CI
      DATABASE_URL: postgresql://mie:ci-only@localhost:5432/mie
      CONFIG_DIR: ${{ github.workspace }}/media-insight-engine/config
      PROMPTS_DIR: ${{ github.workspace }}/media-insight-engine/prompts
      GOLDEN_DIR: ${{ github.workspace }}/media-insight-engine/golden
      EMBED_MODEL: BAAI/bge-small-en-v1.5   # same model the Dockerfile bakes in
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: media-insight-engine/server/requirements.txt
      - run: pip install -r requirements.txt
      # test_day2_pdf.py renders its test PDFs with Chromium (Playwright comes with crawl4ai)
      - run: python -m playwright install --with-deps chromium
      - uses: actions/cache@v4
        with:
          path: ${{ env.FASTEMBED_CACHE_PATH }}
          key: fastembed-${{ env.EMBED_MODEL }}
      # The golden set (python -m app.golden) is not run here: it needs ANTHROPIC_API_KEY and makes model calls.
      - run: pytest -q

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media-insight-engine/client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: media-insight-engine/client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build   # tsc --noEmit + vite build

  # Helm chart + Kustomize overlays render for every environment (the chart is published by helm-release.yml)
  k8s:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media-insight-engine/k8s
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - run: bash scripts/chart-files.sh
      - run: |
          for env in dev test prod; do
            helm lint charts/media-insight-engine -n "mie-$env" -f "overlays/$env/values.yaml"
            helm template mie charts/media-insight-engine -n "mie-$env" -f "overlays/$env/values.yaml" >/dev/null
            kubectl kustomize "overlays/$env" >/dev/null
          done

  publish:
    needs: [server, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}   # GHCR needs lowercase; this owner already is
    # ponytail: images are only built on main (the server image bakes Chromium + the 1.6 GB Whisper model);
    # add a build-only job on PRs if Dockerfile breaks start slipping through
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: media-insight-engine/server
          push: true
          tags: |
            ${{ env.REGISTRY }}/mie-server:${{ github.sha }}
            ${{ env.REGISTRY }}/mie-server:latest
          cache-from: type=gha,scope=mie-server
          cache-to: type=gha,scope=mie-server,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: media-insight-engine/client
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/mie-client:${{ github.sha }}
            ${{ env.REGISTRY }}/mie-client:latest
          cache-from: type=gha,scope=mie-client
          cache-to: type=gha,scope=mie-client,mode=max
